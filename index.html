<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pie Chart Designer — Glassmorphism Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-row">
                <span class="logo-emoji">🍕</span>
                <div class="title-col">
                    <h1>Pie Chart Designer</h1>
                    <p class="tagline">Segment planner showing custom share allocations.</p>
                </div>
            </div>
            <div class="badge">data</div>
        </header>

        <main class="workspace-card">
            
            <div style="display:flex; justify-content:center;">
                <div class="pie" style="width:100px; height:100px; border-radius:50%; background:conic-gradient(orange 0% 40%, cyan 40% 100%);"></div>
            </div>
        
        </main>
        
        <footer class="app-footer">
            <p>Created as a premium portfolio piece by <a href="https://github.com/VARSHAN69" target="_blank">@VARSHAN69</a></p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
